<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usuarios · AgroRed</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <div class="app">
    <aside class="lateral" id="lateral">
      <a class="marca" href="usuarios.html"><span class="punto"></span>AgroRed</a>
      <nav id="menu"></nav>
      <p class="lateral-pie">Acceso solo desde la subred<br>172.16.1.56/29</p>
    </aside>
    <div class="velo" id="velo"></div>

    <div class="contenido">
      <header class="superior">
        <button class="icono-btn menu-movil" id="btnMenu" aria-label="Abrir menú"><span data-ico="menu"></span></button>
        <div class="titulo">
          <h1>Usuarios</h1>
          <p>Cuentas de acceso y roles de AgroRed</p>
        </div>
        <div class="usuario">
          <span class="avatar" id="avatar"></span>
          <div class="usuario-datos">
            <strong id="nombreUsuario"></strong>
            <span class="rol-tag" id="rolUsuario"></span>
          </div>
          <button class="icono-btn" id="btnSalir" title="Cerrar sesión"><span data-ico="logout"></span></button>
        </div>
      </header>

      <main>
        <section class="resumen">
          <article class="stat" style="--i:0"><small>Usuarios registrados</small><strong id="stTotal">0</strong></article>
          <article class="stat" style="--i:1"><small>Administradores</small><strong id="stAdm">0</strong></article>
          <article class="stat" style="--i:2"><small>Comerciales</small><strong id="stCom">0</strong></article>
          <article class="stat oro" style="--i:3"><small>Producción</small><strong id="stPro">0</strong></article>
        </section>

        <section class="panel">
          <div class="barra-herr">
            <label class="buscador">
              <span class="ico-b" data-ico="search"></span>
              <input class="entrada" id="buscar" type="search" placeholder="Buscar por nombre o correo…" autocomplete="off">
            </label>
            <div class="chips" id="chips">
              <button class="chip activo" data-rol="">Todos</button>
              <button class="chip" data-rol="administrador">Administrador</button>
              <button class="chip" data-rol="comercial">Comercial</button>
              <button class="chip" data-rol="produccion">Producción</button>
            </div>
            <button class="btn oro" id="btnNuevo"><span data-ico="plus"></span>Nuevo usuario</button>
          </div>
          <div class="tabla-caja">
            <table>
              <thead><tr><th>Usuario</th><th>Rol</th><th>Estado</th><th></th></tr></thead>
              <tbody id="cuerpo"></tbody>
            </table>
          </div>
          <p class="conteo" id="conteo"></p>
        </section>
      </main>
    </div>
  </div>

  <div class="modal" id="modalForm">
    <div class="modal-caja" role="dialog" aria-modal="true" aria-labelledby="tituloForm">
      <div class="modal-cab">
        <h2 id="tituloForm">Nuevo usuario</h2>
        <button class="icono-btn" data-cerrar aria-label="Cerrar"><span data-ico="x"></span></button>
      </div>
      <form id="form" novalidate autocomplete="off">
        <div class="rejilla">
          <label class="campo ancho"><span>Nombre</span><input class="entrada" name="nombre" maxlength="100"><em class="err"></em></label>
          <label class="campo ancho"><span>Correo</span><input class="entrada" name="email" maxlength="120"><em class="err"></em></label>
          <label class="campo"><span>Rol</span>
            <select class="entrada" name="rol">
              <option value="">Selecciona…</option>
              <option value="administrador">Administrador</option>
              <option value="comercial">Comercial</option>
              <option value="produccion">Producción</option>
            </select><em class="err"></em>
          </label>
          <label class="campo"><span>Estado</span>
            <select class="entrada" name="activo">
              <option value="true">Activo</option>
              <option value="false">Inactivo</option>
            </select><em class="err"></em>
          </label>
          <label class="campo ancho"><span id="etiquetaPass">Contraseña</span><input class="entrada" name="password" type="password" autocomplete="new-password"><em class="err"></em></label>
        </div>
        <div class="form-pie">
          <button type="button" class="btn sec" data-cerrar>Cancelar</button>
          <button type="submit" class="btn oro" id="btnGuardar"><span id="textoGuardar">Crear usuario</span></button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal" id="modalEliminar">
    <div class="modal-caja chica" role="dialog" aria-modal="true">
      <div class="modal-cab"><h2>Eliminar usuario</h2>
        <button class="icono-btn" data-cerrar aria-label="Cerrar"><span data-ico="x"></span></button>
      </div>
      <p class="texto-modal">¿Seguro que quieres eliminar a <strong id="nombreBorrar"></strong>? Esta acción no se puede deshacer.</p>
      <div class="form-pie">
        <button class="btn sec" data-cerrar>Cancelar</button>
        <button class="btn peligro" id="btnConfirmar">Eliminar</button>
      </div>
    </div>
  </div>

  <div id="toasts"></div>

  <script src="js/config.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/usuarios.js"></script>
</body>
</html>
