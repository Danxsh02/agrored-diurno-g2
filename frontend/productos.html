<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Productos · AgroRed</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <div class="app">
    <aside class="lateral" id="lateral">
      <a class="marca" href="productos.html"><span class="punto"></span>AgroRed</a>
      <nav id="menu"></nav>
      <p class="lateral-pie">Acceso solo desde la subred<br>172.16.1.56/29</p>
    </aside>
    <div class="velo" id="velo"></div>

    <div class="contenido">
      <header class="superior">
        <button class="icono-btn menu-movil" id="btnMenu" aria-label="Abrir menú"><span data-ico="menu"></span></button>
        <div class="titulo">
          <h1>Productos</h1>
          <p>Catálogo de productos de AgroRed</p>
        </div>
        <div class="usuario">
          <span class="avatar" id="avatar"></span>
          <div class="usuario-datos">
            <strong id="nombreUsuario"></strong>
            <span class="rol-tag" id="rolUsuario"></span>
          </div>
          <button class="icono-btn" id="btnSalir" title="Cerrar sesión"><span data-ico="logout"></span></button>
        </div>
      </header>

      <main>
        <section class="resumen">
          <article class="stat" style="--i:0"><small>Productos registrados</small><strong id="stTotal">0</strong></article>
          <article class="stat" style="--i:1"><small>Frutas</small><strong id="stFru">0</strong></article>
          <article class="stat oro" style="--i:2"><small>Hortalizas</small><strong id="stHor">0</strong></article>
          <article class="stat" style="--i:3"><small>Procesados</small><strong id="stPro">0</strong></article>
        </section>

        <div class="aviso" id="aviso" hidden>
          <span data-ico="lock" data-tam="20"></span><span id="avisoTexto"></span>
        </div>

        <section class="panel">
          <div class="barra-herr">
            <label class="buscador">
              <span class="ico-b" data-ico="search"></span>
              <input class="entrada" id="buscar" type="search" placeholder="Buscar por nombre…" autocomplete="off">
            </label>
            <div class="chips" id="chips">
              <button class="chip activo" data-categoria="">Todos</button>
              <button class="chip" data-categoria="fruta">Frutas</button>
              <button class="chip" data-categoria="hortaliza">Hortalizas</button>
              <button class="chip" data-categoria="procesado">Procesados</button>
            </div>
            <button class="btn oro" id="btnNuevo" hidden><span data-ico="plus"></span>Nuevo producto</button>
          </div>
          <div class="tabla-caja">
            <table><thead id="cabecera"></thead><tbody id="cuerpo"></tbody></table>
          </div>
          <p class="conteo" id="conteo"></p>
        </section>
      </main>
    </div>
  </div>

  <!-- Formulario crear / editar -->
  <div class="modal" id="modalForm">
    <div class="modal-caja" role="dialog" aria-modal="true" aria-labelledby="tituloForm">
      <div class="modal-cab">
        <h2 id="tituloForm">Nuevo producto</h2>
        <button class="icono-btn" data-cerrar aria-label="Cerrar"><span data-ico="x"></span></button>
      </div>
      <form id="form" novalidate>
        <div class="rejilla">
          <label class="campo ancho"><span>Nombre</span><input class="entrada" name="nombre" maxlength="100"><em class="err"></em></label>
          <label class="campo"><span>Categoría</span>
            <select class="entrada" name="categoria">
              <option value="">Selecciona…</option>
              <option value="fruta">Fruta</option>
              <option value="hortaliza">Hortaliza</option>
              <option value="procesado">Procesado</option>
            </select><em class="err"></em>
          </label>
          <label class="campo"><span>Unidad</span>
            <select class="entrada" name="unidad">
              <option value="">Selecciona…</option>
              <option value="kg">Kilogramo (kg)</option>
              <option value="caja">Caja</option>
            </select><em class="err"></em>
          </label>
          <label class="campo"><span>Precio (COP)</span><input class="entrada" name="precio" type="number" min="0" step="any" placeholder="4200"><em class="err"></em></label>
          <label class="campo"><span>Estado</span>
            <select class="entrada" name="activo">
              <option value="true">Activo</option>
              <option value="false">Inactivo</option>
            </select><em class="err"></em>
          </label>
        </div>
        <div class="form-pie">
          <button type="button" class="btn sec" data-cerrar>Cancelar</button>
          <button type="submit" class="btn oro" id="btnGuardar"><span id="textoGuardar">Crear producto</span></button>
        </div>
      </form>
    </div>
  </div>

  <!-- Confirmación de eliminación -->
  <div class="modal" id="modalEliminar">
    <div class="modal-caja chica" role="dialog" aria-modal="true">
      <div class="modal-cab"><h2>Eliminar producto</h2>
        <button class="icono-btn" data-cerrar aria-label="Cerrar"><span data-ico="x"></span></button>
      </div>
      <p class="texto-modal">¿Seguro que quieres eliminar el producto <strong id="nombreBorrar"></strong>? Esta acción no se puede deshacer.</p>
      <div class="form-pie">
        <button class="btn sec" data-cerrar>Cancelar</button>
        <button class="btn peligro" id="btnConfirmar">Eliminar</button>
      </div>
    </div>
  </div>

  <div id="toasts"></div>

  <script src="js/config.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api-productos.js"></script>
  <script src="js/productos.js"></script>
</body>
</html>
